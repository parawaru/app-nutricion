<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro Kcal</title>

<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">

</head>

<body>

<header>

Registro Kcal

</header>

<main id="app">

<section id="dashboard">

<div class="card">

<h2>Calorías restantes</h2>

<div class="circle" id="circle">

<span id="remaining">1400</span>

</div>

<div class="stats">

<div>

Objetivo

<span id="goal">1400</span>

</div>

<div>

Alimentos

<span id="foodTotal">0</span>

</div>

<div>

Ejercicio

<span id="exercise">0</span>

</div>

</div>

</div>

</section>


<section id="diario">

<div class="meal">

<h3>Desayuno</h3>

<div id="desayuno"></div>

<button onclick="addFood('desayuno')">

Agregar alimento

</button>

</div>

<div class="meal">

<h3>Comida</h3>

<div id="comida"></div>

<button onclick="addFood('comida')">

Agregar alimento

</button>

</div>

<div class="meal">

<h3>Cena</h3>

<div id="cena"></div>

<button onclick="addFood('cena')">

Agregar alimento

</button>

</div>

</section>

<section id="progreso">

<div class="card">

<h2>Peso</h2>

<canvas id="weightChart"></canvas>

</div>

<div class="card">

<h2>Calorías</h2>

<canvas id="kcalChart"></canvas>

</div>

</section>

</main>

<div class="fab" onclick="quickAdd()">+</div>

<nav class="navbar">

<div class="nav active">Panel</div>

<div class="nav">Diario</div>

<div class="nav">Progreso</div>

<div class="nav">Más</div>

</nav>

<script src="database.js"></script>
<script src="charts.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>

</body>

</html>
