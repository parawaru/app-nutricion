<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Registro Kcal</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

</head>

<body>

<header>
<h1>Registro Kcal</h1>
</header>

<main>

<section id="pantalla-hoy" class="pantalla active">

<h2>Hoy</h2>

<input type="date" id="fechaHoy">

<div class="comida">

<h3>Desayuno</h3>
<ul id="desayuno"></ul>

<h3>Almuerzo</h3>
<ul id="almuerzo"></ul>

<h3>Comida</h3>
<ul id="comida"></ul>

<h3>Merienda</h3>
<ul id="merienda"></ul>

<h3>Cena</h3>
<ul id="cena"></ul>

</div>

<h3>Total kcal</h3>
<p id="totalHoy">0</p>

</section>


<section id="pantalla-registrar" class="pantalla">

<h2>Registrar comida</h2>

<select id="tipoComida">

<option>Desayuno</option>
<option>Almuerzo</option>
<option>Comida</option>
<option>Merienda</option>
<option>Cena</option>

</select>

<select id="listaAlimentos"></select>

<input id="gramos" placeholder="Gramos">

<button onclick="añadirComida()">Añadir comida</button>

</section>


<section id="pantalla-alimentos" class="pantalla">

<h2>Alimentos</h2>

<input type="file" id="imagen">

<button onclick="leerEtiqueta()">Leer etiqueta</button>

<input id="nombre" placeholder="Nombre alimento">
<input id="kcal" placeholder="Kcal /100g">

<button onclick="guardarAlimento()">Guardar alimento</button>

<ul id="listaAlimentosGuardados"></ul>

</section>


<section id="pantalla-progreso" class="pantalla">

<h2>Progreso</h2>

<h3>Gráfico calorías</h3>
<canvas id="graficoCalorias"></canvas>

<h3>Peso</h3>

<input id="pesoInput" placeholder="Peso">

<button onclick="guardarPeso()">Guardar peso</button>

<canvas id="graficoPeso"></canvas>

</section>


<section id="pantalla-historial" class="pantalla">

<h2>Historial</h2>

<input type="date" id="fechaHistorial">

<button onclick="verHistorial()">Ver día</button>

<ul id="historialLista"></ul>

</section>

</main>


<nav class="nav">

<button onclick="cambiarPantalla('hoy')">🏠</button>
<button onclick="cambiarPantalla('registrar')">🍽</button>
<button onclick="cambiarPantalla('alimentos')">📦</button>
<button onclick="cambiarPantalla('progreso')">📊</button>
<button onclick="cambiarPantalla('historial')">📅</button>

</nav>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
navigator.serviceWorker.register("service-worker.js")
}
</script>

</body>
</html>
